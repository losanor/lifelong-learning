<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="storage-warning" class="storage-warning" hidden>
    Seus dados não serão salvos neste navegador.
  </div>
  <main>
    <h1>Minhas Tarefas</h1>
    <div class="entrada-tarefa">
      <input
        type="text"
        id="task-input"
        placeholder="Digite uma tarefa..."
        maxlength="500"
        autocomplete="off"
      >
      <button id="add-button" type="button">Adicionar</button>
    </div>
    <ul id="task-list" aria-label="Lista de tarefas"></ul>
    <p id="empty-state" class="empty-state" hidden>Nenhuma tarefa ainda.</p>
  </main>
  <script defer src="app.js"></script>
</body>
</html>
